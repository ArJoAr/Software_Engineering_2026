name: Expo CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

jobs:
  # STAGE 1: Code Review & Type Checking
  lint-and-typecheck:
    name: Code Review & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatiza la caché de dependencias para ir más rápido

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (expo lint)
        run: npm run lint

      - name: Run TypeScript Check (tsc)
        run: npm run typecheck

  # STAGE 2: Build Verification (Solo si la etapa 1 tiene éxito)
  build-test:
    name: Verify Web Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck # <--- Tu Quality Gate de Agile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build:web